cat > docker-compose.yml << 'EOF'
services:
  config-server:
    build: ./spring-cloud-config-server
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/loan-service/default"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  loan-service-dev:
    build: ./loan-service
    container_name: loan-service-dev
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8082

  loan-service-uat:
    build: ./loan-service
    container_name: loan-service-uat
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=uat
      - SERVER_PORT=8083
EOF
